<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIRIUKA | Bio Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        :root { --bg: #050505; --accent: #ffffff; }

        html, body { scroll-behavior: smooth; }

        body {
            background-color: var(--bg); color: #fff;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ==========================================
           LOADING SCREEN
           ========================================== */
        #loader {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 36px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loader.hide { opacity: 0; visibility: hidden; }

        .loader-stage {
            position: relative;
            width: 140px; height: 140px;
            display: flex; align-items: center; justify-content: center;
        }

        .loader-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid transparent;
        }
        .ring-outer {
            width: 140px; height: 140px;
            border-top-color: rgba(255,255,255,0.7);
            animation: rotateRing 2s linear infinite;
        }
        .ring-mid {
            width: 110px; height: 110px;
            border-bottom-color: rgba(255,255,255,0.4);
            animation: rotateRing 2.5s linear infinite reverse;
        }
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loader-logo {
            position: relative;
            width: 70px; height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.9);
            background: #111;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 900;
            box-shadow: 0 0 25px rgba(255,255,255,0.35);
            z-index: 2;
        }
        .loader-logo img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .loader-bar {
            width: 200px; height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #555, #fff, #555);
            background-size: 200% 100%;
            animation: loadBar 2.2s ease forwards, shimmer 1.2s linear infinite;
            box-shadow: 0 0 12px rgba(255,255,255,0.7);
        }
        @keyframes loadBar {
            0% { width: 0%; }
            30% { width: 45%; }
            60% { width: 70%; }
            100% { width: 100%; }
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loader-text {
            font-size: 9px;
            letter-spacing: 6px;
            color: #555;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* ==========================================
           SCROLL PROGRESS
           ========================================== */
        .scroll-progress {
            position: fixed; top: 0; left: 0;
            height: 2px; width: 0%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            z-index: 9998;
            box-shadow: 0 0 10px #fff;
        }

        /* ==========================================
           CANVAS
           ========================================== */
        #particles-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }
        #confetti-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9997;
        }

        /* ==========================================
           TOP NAV
           ========================================== */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: center;
            padding: 15px 18px; z-index: 10;
            background: linear-gradient(to bottom, rgba(5,5,5,0.95), transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-content { width: 100%; max-width: 460px; display: flex; gap: 10px; align-items: center; }

        .search-box {
            flex: 1; display: flex; align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px; padding: 10px 16px;
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.35);
        }
        .search-box svg { width: 16px; height: 16px; fill: #71717a; margin-right: 10px; flex-shrink: 0; }
        .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13.5px; font-weight: 500; }
        .search-box input::placeholder { color: #52525b; }

        .clock-display {
            font-size: 12px; color: #d4d4d8; font-weight: 700;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-variant-numeric: tabular-nums;
        }

        .menu-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; flex-shrink: 0;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn svg { width: 18px; height: 18px; fill: #fff; }

        /* ==========================================
           CONTAINER
           ========================================== */
        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px;
            padding: 82px 20px 50px;
            display: flex; flex-direction: column; gap: 22px;
            animation: fadeIn 1s ease-out;
        }

        /* ==========================================
           PROFILE - CLEAN & ELEGANT
           ========================================== */
        .profile {
            display: none; flex-direction: column;
            align-items: center; text-align: center;
            gap: 16px;
            animation: fadeInUp 0.8s ease-out;
        }
        .profile.active { display: flex; }

        .avatar-wrapper {
            position: relative;
            width: 110px; height: 110px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Cincin conic gradient yang halus */
        .avatar-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent 0%, #fff 30%, transparent 60%, #fff 90%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spinRing 3s linear infinite;
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        /* Glow di belakang avatar */
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: glowBreath 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowBreath {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.15); }
        }

        .profile-avatar {
            position: relative;
            width: 96px; height: 96px;
            border-radius: 50%;
            overflow: hidden;
            background: #0a0a0a;
            border: 2px solid rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 900;
            z-index: 2;
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .profile-avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .profile-name {
            font-size: 24px; font-weight: 900;
            letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
        }

        .profile-bio {
            font-size: 12.5px; color: #a1a1aa;
            letter-spacing: 0.8px;
            min-height: 16px;
            font-weight: 500;
            margin-top: 2px;
        }
        .profile-bio::after {
            content: '|';
            color: #fff;
            animation: blink 0.9s step-end infinite;
            margin-left: 2px;
            font-weight: 300;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .visitor-counter {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 13px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-size: 10.5px; color: #a1a1aa;
            letter-spacing: 1px; font-weight: 600;
            margin-top: 4px;
        }
        .visitor-counter .dot-live {
            width: 6px; height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ==========================================
           VIDEO
           ========================================== */
        .video-wrapper {
            width: 100%; height: 200px;
            border-radius: 20px; overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 25px rgba(255,255,255,0.05);
            background: #0a0a0a;
            animation: fadeInUp 0.9s ease-out;
        }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .video-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(to top, var(--bg), transparent);
            pointer-events: none;
        }

        /* ==========================================
           LINKS
           ========================================== */
        .links { width: 100%; display: flex; flex-direction: column; gap: 16px; }

        .link-item {
            animation: fadeInUp 0.6s ease-out backwards;
            display: flex; flex-direction: column; gap: 8px;
            position: relative;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 18px 24px;
            background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            color: #fff; text-decoration: none;
            font-weight: 700; font-size: 15px; letter-spacing: 1px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 24px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
            cursor: pointer; user-select: none;
        }

        .btn .btn-icon {
            position: relative; z-index: 3;
            display: flex; align-items: center; justify-content: center;
            width: 28px; height: 28px;
            transition: transform 0.4s ease;
            pointer-events: none;
            font-size: 20px;
            flex-shrink: 0;
        }
        .btn .btn-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 6px;
            display: block;
        }
        .btn .btn-text {
            position: relative; z-index: 3;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .btn:hover .btn-icon { transform: scale(1.2); }

        /* BADGE - FIXED POSITION (di dalam tombol) */
        .badge {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            padding: 3px 9px;
            font-size: 8.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            border-radius: 50px;
            z-index: 4;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .badge-new { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .badge-hot { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .badge-mod { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; }
        .badge-vip { background: linear-gradient(135deg, #facc15, #eab308); color: #000; }

        /* Efek shine halus */
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease; z-index: 1;
        }
        .btn:hover::before { left: 150%; }

        .btn:hover {
            background: linear-gradient(145deg, #fff, #d4d4d8);
            color: #000;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px rgba(255,255,255,0.15);
            border-color: transparent;
        }
        .btn:hover .badge { box-shadow: 0 2px 12px rgba(0,0,0,0.7); }

        .btn.confirm {
            background: linear-gradient(145deg, #fff, #e5e5e5) !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 30px rgba(255,255,255,0.6), 0 15px 35px rgba(0,0,0,0.5) !important;
            animation: shakeConfirm 0.5s ease;
        }
        @keyframes shakeConfirm {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .ripple {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            animation: rippleAnim 0.8s ease-out;
            pointer-events: none; z-index: 2;
        }
        @keyframes rippleAnim { to { transform: scale(5); opacity: 0; } }

        .version-label {
            font-size: 10.5px; color: #52525b;
            letter-spacing: 1.5px; text-align: center;
            font-weight: 600; text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .link-item:hover .version-label { color: #a1a1aa; }

        /* ==========================================
           TOAST
           ========================================== */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255,255,255,0.98); color: #000;
            padding: 12px 24px; border-radius: 50px;
            font-size: 12.5px; font-weight: 700;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ==========================================
           ANIMASI
           ========================================== */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .container { padding-top: 78px; gap: 18px; }
            .video-wrapper { height: 175px; }
            .btn { padding: 16px; font-size: 14px; }
            .avatar-wrapper { width: 100px; height: 100px; }
            .profile-avatar { width: 88px; height: 88px; }
            .profile-name { font-size: 21px; letter-spacing: 4px; }
            .badge { font-size: 8px; padding: 2px 7px; right: 12px; }
            .clock-display { font-size: 11px; padding: 8px 11px; }
        }
    </style>
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- LOADING -->
    <div id="loader">
        <div class="loader-stage">
            <div class="loader-ring ring-outer"></div>
            <div class="loader-ring ring-mid"></div>
            <div class="loader-logo" id="loaderLogo">⚡</div>
        </div>
        <div class="loader-bar"><div class="loader-bar-inner"></div></div>
        <div class="loader-text">Loading</div>
    </div>

    <canvas id="particles-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- TOP NAV -->
    <div class="top-nav">
        <div class="nav-content">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Cari link...">
            </div>
            <div class="clock-display" id="clockDisplay">--:--</div>
            <div class="menu-btn" id="menuBtn">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- PROFILE -->
        <div class="profile" id="profileSection">
            <div class="avatar-wrapper" id="avatarWrapper">
                <div class="avatar-ring"></div>
                <div class="profile-avatar" id="profileAvatar">
                    <span id="profileAvatarFallback">S</span>
                    <img id="profileAvatarImg" style="display:none;" alt="Logo">
                </div>
            </div>
            <div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-bio" id="profileBio"></div>
            </div>
            <div class="visitor-counter">
                <span class="dot-live"></span>
                <span id="visitorCount">0</span> views
            </div>
        </div>

        <!-- VIDEO -->
        <div class="video-wrapper">
            <video id="mainVideo" autoplay loop muted playsinline></video>
            <div class="video-overlay"></div>
        </div>

        <!-- LINKS -->
        <div class="links" id="linksContainer"></div>
    </div>

    <div class="toast" id="toast"><span>👆</span> Klik sekali lagi untuk membuka</div>

    <script src="data.js"></script>
    <script>
        // ==========================================================
        //   MULTI-PROXY IMAGE LOADER
        //   Coba beberapa server proxy sampai gambar berhasil load
        // ==========================================================
        function buildProxyList(url) {
            if (!url) return [];
            if (url.startsWith('data:') || url.startsWith('blob:')) return [url];
            const clean = url.replace(/^https?:\/\//, '');
            const encoded = encodeURIComponent(url);
            return [
                url,                                                                    // 1. Direct
                'https://images.weserv.nl/?url=' + clean,                               // 2. wsrv.nl
                'https://api.allorigins.win/raw?url=' + encoded,                        // 3. allorigins
                'https://corsproxy.io/?' + encoded,                                     // 4. corsproxy
                'https://api.codetabs.com/v1/proxy?quest=' + encoded                    // 5. codetabs
            ];
        }

        function loadImageWithFallback(url, onSuccess, onError) {
            const proxies = buildProxyList(url);
            let index = 0;
            function tryNext() {
                if (index >= proxies.length) { onError(); return; }
                const testUrl = proxies[index++];
                const img = new Image();
                let done = false;
                const timer = setTimeout(() => {
                    if (!done) { done = true; tryNext(); }
                }, 5000);
                img.onload = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    if (img.naturalWidth < 5) { tryNext(); return; }
                    onSuccess(testUrl);
                };
                img.onerror = () => {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    tryNext();
                };
                img.src = testUrl;
            }
            tryNext();
        }

        // ==========================================================
        //   TEMA
        // ==========================================================
        const theme = LINK_DATA.theme || {};
        if (theme.background) document.documentElement.style.setProperty('--bg', theme.background);
        if (theme.accent) document.documentElement.style.setProperty('--accent', theme.accent);
        document.body.style.background = theme.background || '#050505';

        // ==========================================================
        //   PROFILE
        // ==========================================================
        const profile = LINK_DATA.profile || {};
        if (profile.enabled) {
            document.getElementById('profileSection').classList.add('active');
            document.getElementById('profileName').textContent = profile.name || '';
            const avatarUrl = profile.avatar || '';
            const initial = (profile.name || 'S').charAt(0);

            const avatarImg = document.getElementById('profileAvatarImg');
            const avatarFallback = document.getElementById('profileAvatarFallback');
            const loaderLogo = document.getElementById('loaderLogo');

            // Load avatar dengan fallback
            loadImageWithFallback(avatarUrl,
                (workingUrl) => {
                    avatarImg.src = workingUrl;
                    avatarImg.style.display = 'block';
                    avatarFallback.style.display = 'none';
                    // Loader logo juga pakai URL yang working
                    const lImg = document.createElement('img');
                    lImg.src = workingUrl;
                    lImg.style.width = '100%';
                    lImg.style.height = '100%';
                    lImg.style.objectFit = 'cover';
                    loaderLogo.innerHTML = '';
                    loaderLogo.appendChild(lImg);
                },
                () => {
                    // Semua proxy gagal - pakai inisial
                    avatarImg.style.display = 'none';
                    avatarFallback.style.display = 'flex';
                    avatarFallback.style.alignItems = 'center';
                    avatarFallback.style.justifyContent = 'center';
                    avatarFallback.style.width = '100%';
                    avatarFallback.style.height = '100%';
                    avatarFallback.textContent = initial;
                    loaderLogo.textContent = initial;
                }
            );

            // Typing effect
            if (profile.typing && profile.bio) {
                const bioEl = document.getElementById('profileBio');
                const text = profile.bio;
                bioEl.textContent = '';
                let i = 0;
                setTimeout(() => {
                    const t = setInterval(() => {
                        bioEl.textContent = text.substring(0, i + 1);
                        i++;
                        if (i >= text.length) clearInterval(t);
                    }, 60);
                }, 2400);
            }
        }

        // ==========================================================
        //   VISITOR COUNTER
        // ==========================================================
        (function() {
            let count = parseInt(localStorage.getItem('visitor_count') || '0') + 1;
            localStorage.setItem('visitor_count', count);
            const el = document.getElementById('visitorCount');
            let cur = 0;
            const step = Math.max(1, Math.ceil(count / 30));
            const iv = setInterval(() => {
                cur += step;
                if (cur >= count) { cur = count; clearInterval(iv); }
                el.textContent = cur.toLocaleString();
            }, 30);
        })();

        // ==========================================================
        //   AUDIO
        // ==========================================================
        let audioCtx = null, soundEnabled = true;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch(e) { soundEnabled = false; }
            }
            return audioCtx;
        }
        function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0) {
            if (!soundEnabled) return;
            const ctx = ensureAudio(); if (!ctx) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = type;
            const t = ctx.currentTime + delay;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
        }
        function soundHover() { tone(1800, 0.05, 'sine', 0.04); }
        function soundClick() { tone(880, 0.1, 'sine', 0.15); tone(1320, 0.08, 'triangle', 0.08, 0.02); }
        function soundConfirm() {
            tone(880, 0.12, 'sine', 0.15);
            tone(1320, 0.15, 'sine', 0.12, 0.08);
            tone(1760, 0.25, 'sine', 0.1, 0.16);
        }
        function vibrate(ms = 40) { if (navigator.vibrate) navigator.vibrate(ms); }

        // ==========================================================
        //   VIDEO
        // ==========================================================
        const videoEl = document.getElementById('mainVideo');
        const sourceEl = document.createElement('source');
        sourceEl.src = LINK_DATA.videoUrl;
        sourceEl.type = 'video/mp4';
        videoEl.appendChild(sourceEl);
        videoEl.play().catch(() => {});

        // ==========================================================
        //   RENDER LINKS
        // ==========================================================
        const linksContainer = document.getElementById('linksContainer');
        const toast = document.getElementById('toast');

        function isImage(src) { return /\.(png|jpg|jpeg|gif|webp|svg)/i.test(src); }

        LINK_DATA.links.forEach((link, index) => {
            const item = document.createElement('div');
            item.className = 'link-item';
            item.style.animationDelay = (0.3 + (index * 0.08)) + 's';

            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'btn';
            a.dataset.name = link.name.toLowerCase();

            // ICON
            const iconWrap = document.createElement('span');
            iconWrap.className = 'btn-icon';

            if (link.icon) {
                if (isImage(link.icon)) {
                    // Pakai multi-fallback juga untuk icon
                    loadImageWithFallback(link.icon,
                        (workingUrl) => {
                            const img = document.createElement('img');
                            img.src = workingUrl;
                            img.alt = '';
                            iconWrap.innerHTML = '';
                            iconWrap.appendChild(img);
                        },
                        () => { iconWrap.textContent = '✦'; }
                    );
                } else {
                    iconWrap.textContent = link.icon;
                }
            } else {
                iconWrap.textContent = '✦';
            }

            // TEXT
            const span = document.createElement('span');
            span.className = 'btn-text';
            span.textContent = link.name;

            a.appendChild(iconWrap);
            a.appendChild(span);

            // BADGE (di dalam tombol, posisi kanan)
            if (link.badge) {
                const badge = document.createElement('span');
                badge.className = 'badge badge-' + link.badge.toLowerCase();
                badge.textContent = link.badge;
                a.appendChild(badge);
            }

            a.addEventListener('mouseenter', soundHover);
            a.addEventListener('touchstart', soundHover, { passive: true });

            if (window.matchMedia('(hover: hover)').matches) {
                a.addEventListener('mousemove', (e) => {
                    const rect = a.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    a.style.transform = `translateY(-4px) scale(1.01) translate(${x * 0.05}px, ${y * 0.08}px)`;
                });
                a.addEventListener('mouseleave', () => { a.style.transform = ''; });
            }

            let confirmState = false;
            let resetTimer = null;
            let pressTimer = null;
            const originalText = link.name;

            // Long-press copy
            const startPress = () => {
                pressTimer = setTimeout(() => {
                    navigator.clipboard.writeText(link.url).then(() => {
                        showToast('📋 Link berhasil di-copy!');
                        vibrate(60);
                    }).catch(() => {});
                }, 700);
            };
            const cancelPress = () => clearTimeout(pressTimer);

            a.addEventListener('mousedown', startPress);
            a.addEventListener('mouseup', cancelPress);
            a.addEventListener('mouseleave', cancelPress);
            a.addEventListener('touchstart', startPress, { passive: true });
            a.addEventListener('touchend', cancelPress);
            a.addEventListener('touchcancel', cancelPress);

            a.addEventListener('click', function(e) {
                if (!confirmState) {
                    e.preventDefault();
                    confirmState = true;
                    soundClick();
                    vibrate(30);

                    const rect = a.getBoundingClientRect();
                    const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
                    const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (x - size / 2) + 'px';
                    ripple.style.top = (y - size / 2) + 'px';
                    a.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 800);

                    a.classList.add('confirm');
                    span.textContent = '⚠️ KLIK LAGI UNTUK BUKA';
                    showToast('👆 Klik sekali lagi untuk membuka');

                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => {
                        confirmState = false;
                        a.classList.remove('confirm');
                        span.textContent = originalText;
                    }, 3000);
                } else {
                    soundConfirm();
                    vibrate([30, 50, 30]);
                    confettiBurst();
                    hideToast();
                }
            });

            item.appendChild(a);

            if (link.version) {
                const versionEl = document.createElement('div');
                versionEl.className = 'version-label';
                versionEl.textContent = link.version;
                item.appendChild(versionEl);
            }

            linksContainer.appendChild(item);
        });

        // ==========================================================
        //   TOAST
        // ==========================================================
        let toastTimer = null;
        function showToast(msg) {
            toast.innerHTML = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 2500);
        }
        function hideToast() { toast.classList.remove('show'); }

        // ==========================================================
        //   CONFETTI
        // ==========================================================
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfetti();
        window.addEventListener('resize', resizeConfetti);

        function confettiBurst() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                confettiParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: ['#ffffff', '#a1a1aa', '#d4d4d8', '#71717a'][Math.floor(Math.random() * 4)],
                    life: 1, gravity: 0.15, friction: 0.96,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15
                });
            }
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= p.friction; p.vy *= p.friction;
                p.vy += p.gravity;
                p.life -= 0.015;
                p.rotation += p.rotationSpeed;
                if (p.life <= 0) { confettiParticles.splice(i, 1); continue; }
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation * Math.PI / 180);
                confettiCtx.globalAlpha = p.life;
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                confettiCtx.restore();
            }
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        // ==========================================================
        //   SEARCH
        // ==========================================================
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.link-item').forEach(item => {
                const name = item.querySelector('.btn').dataset.name;
                item.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        });

        // ==========================================================
        //   MENU
        // ==========================================================
        document.getElementById('menuBtn').addEventListener('click', () => {
            soundClick();
            vibrate(30);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ==========================================================
        //   CLOCK
        // ==========================================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockDisplay').textContent = h + ':' + m;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ==========================================================
        //   SCROLL PROGRESS
        // ==========================================================
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            document.getElementById('scrollProgress').style.width = percent + '%';
        });

        // ==========================================================
        //   PARTIKEL
        // ==========================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        let shootingStars = [];
        const numberOfParticles = 80;
        const maxDistance = 130;
        const mouse = { x: null, y: null, radius: 120 };

        function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        setCanvasSize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.glow = Math.random() > 0.8;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = this.x - mouse.x, dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x += (dx / dist) * force * 2.5;
                        this.y += (dy / dist) * force * 2.5;
                    }
                }
            }
            draw() {
                if (this.glow) { ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,255,255,0.9)'; }
                else { ctx.shadowBlur = 0; }
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.len = Math.random() * 120 + 80;
                this.speed = Math.random() * 6 + 6;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
                this.opacity = 0.7;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.008;
                if (this.y > canvas.height + 50 || this.opacity <= 0) this.reset();
            }
            draw() {
                const tailX = this.x - Math.cos(this.angle) * this.len;
                const tailY = this.y - Math.sin(this.angle) * this.len;
                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = grad; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tailX, tailY); ctx.stroke();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle());
            shootingStars = [];
            for (let i = 0; i < 2; i++) shootingStars.push(new ShootingStar());
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    const dx = particlesArray[a].x - particlesArray[b].x;
                    const dy = particlesArray[a].y - particlesArray[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const op = 1 - (dist / maxDistance);
                        ctx.strokeStyle = `rgba(255,255,255,${op * 0.18})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            shootingStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => { setCanvasSize(); init(); });

        init(); animate();

        // ==========================================================
        //   HIDE LOADER
        // ==========================================================
        setTimeout(() => {
            document.getElementById('loader').classList.add('hide');
        }, 2400);
    </script>

</body>
</html>
