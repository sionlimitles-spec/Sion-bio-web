<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIRIUKA | Bio Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        :root { --bg: #050505; --accent: #ffffff; }

        html, body { scroll-behavior: smooth; }

        body {
            background-color: var(--bg); color: #fff;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ==========================================
           LOADING SCREEN - PREMIUM
           ========================================== */
        #loader {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 40px;
            transition: opacity 1s ease, visibility 1s ease;
        }
        #loader.hide { opacity: 0; visibility: hidden; }

        .loader-stage {
            position: relative;
            width: 160px; height: 160px;
            display: flex; align-items: center; justify-content: center;
        }

        .loader-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
        }

        .ring-outer {
            width: 160px; height: 160px;
            border-top-color: rgba(255,255,255,0.6);
            border-right-color: rgba(255,255,255,0.1);
            animation: rotateRing 2s linear infinite;
        }

        .ring-mid {
            width: 130px; height: 130px;
            border-bottom-color: rgba(255,255,255,0.5);
            border-left-color: rgba(255,255,255,0.1);
            animation: rotateRing 2.5s linear infinite reverse;
        }

        .ring-inner {
            width: 100px; height: 100px;
            border-top-color: rgba(255,255,255,0.4);
            border-left-color: rgba(255,255,255,0.1);
            animation: rotateRing 1.5s linear infinite;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loader-glow {
            position: absolute;
            width: 80px; height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            animation: glowPulse 1.8s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        .loader-logo {
            position: relative;
            width: 70px; height: 70px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.9);
            background: #111;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 900;
            box-shadow: 0 0 30px rgba(255,255,255,0.4), inset 0 0 20px rgba(255,255,255,0.1);
            z-index: 2;
            animation: logoBreath 2s ease-in-out infinite;
        }
        @keyframes logoBreath {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .loader-logo img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .loader-bar-wrap {
            display: flex; flex-direction: column;
            align-items: center; gap: 14px;
            width: 220px;
        }

        .loader-bar {
            width: 100%; height: 3px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .loader-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #555, #fff, #555);
            background-size: 200% 100%;
            border-radius: 3px;
            animation: loadBar 2.2s ease forwards, shimmer 1s linear infinite;
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        @keyframes loadBar {
            0% { width: 0%; }
            30% { width: 45%; }
            60% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .loader-text {
            font-size: 10px;
            letter-spacing: 6px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            animation: textFlicker 2s ease-in-out infinite;
        }

        @keyframes textFlicker {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ==========================================
           SCROLL PROGRESS
           ========================================== */
        .scroll-progress {
            position: fixed; top: 0; left: 0;
            height: 2px; width: 0%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            z-index: 9998;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px #fff;
        }

        /* ==========================================
           CANVAS
           ========================================== */
        #particles-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }

        #confetti-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9997;
        }

        .grid-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, black 10%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 70%);
        }

        /* ==========================================
           TOP NAV
           ========================================== */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: center;
            padding: 16px 20px; z-index: 10;
            background: linear-gradient(to bottom, rgba(5,5,5,0.95), transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-content { width: 100%; max-width: 480px; display: flex; gap: 10px; align-items: center; }

        .search-box {
            flex: 1; display: flex; align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px; padding: 11px 18px;
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 0 25px rgba(255,255,255,0.12);
        }
        .search-box svg { width: 17px; height: 17px; fill: #71717a; margin-right: 10px; flex-shrink: 0; }
        .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 14px; font-weight: 500; }
        .search-box input::placeholder { color: #52525b; }

        .clock-display {
            font-size: 12px; color: #d4d4d8; font-weight: 700;
            letter-spacing: 1px; white-space: nowrap;
            padding: 11px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-variant-numeric: tabular-nums;
        }

        .menu-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; flex-shrink: 0;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.08) rotate(90deg); }
        .menu-btn svg { width: 18px; height: 18px; fill: #fff; }

        /* ==========================================
           CONTAINER
           ========================================== */
        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px;
            padding: 88px 20px 50px;
            display: flex; flex-direction: column; gap: 24px;
            animation: fadeIn 1s ease-out;
        }

        /* ==========================================
           PROFILE
           ========================================== */
        .profile {
            display: none; flex-direction: column;
            align-items: center; text-align: center;
            gap: 16px; animation: fadeInUp 0.8s ease-out;
        }
        .profile.active { display: flex; }

        .avatar-stage {
            position: relative;
            width: 140px; height: 140px;
            display: flex; align-items: center; justify-content: center;
            perspective: 1000px;
        }

        .orbit-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
        }
        .orbit-ring span {
            position: absolute;
            top: 50%; left: 50%;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,0.6);
        }

        .orbit-1 { animation: orbitSpin 7s linear infinite; }
        .orbit-1 span { width: 6px; height: 6px; transform: translate(-50%, -50%) rotate(0deg) translateX(62px); }
        .orbit-1 span:nth-child(2) { transform: translate(-50%, -50%) rotate(180deg) translateX(62px); }

        .orbit-2 { animation: orbitSpinRev 10s linear infinite; }
        .orbit-2 span { width: 4px; height: 4px; transform: translate(-50%, -50%) rotate(90deg) translateX(68px); opacity: 0.8; }
        .orbit-2 span:nth-child(2) { transform: translate(-50%, -50%) rotate(270deg) translateX(68px); }

        .orbit-3 { animation: orbitSpin 15s linear infinite; }
        .orbit-3 span { width: 3px; height: 3px; transform: translate(-50%, -50%) rotate(45deg) translateX(72px); opacity: 0.5; }
        .orbit-3 span:nth-child(2) { transform: translate(-50%, -50%) rotate(225deg) translateX(72px); }

        @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orbitSpinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        .pulse-wave {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.35);
            animation: pulseWave 3s ease-out infinite;
            pointer-events: none;
        }
        .pulse-wave:nth-child(2) { animation-delay: 1s; }
        .pulse-wave:nth-child(3) { animation-delay: 2s; }
        @keyframes pulseWave {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.7); opacity: 0; }
        }

        .avatar-ring {
            position: absolute;
            width: 110px; height: 110px;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(from 0deg, #fff, #444, #fff, #444, #fff);
            animation: spinAvatarRing 4s linear infinite;
            z-index: 3;
        }
        @keyframes spinAvatarRing { to { transform: rotate(360deg); } }

        .profile-avatar {
            position: relative;
            width: 106px; height: 106px;
            border-radius: 50%;
            overflow: hidden;
            background: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
            font-size: 42px; font-weight: 900;
            z-index: 4;
            transition: transform 0.4s ease;
            transform-style: preserve-3d;
            border: 3px solid #050505;
        }
        .profile-avatar img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .sparkle {
            position: absolute;
            width: 3px; height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
            animation: sparkleAnim 2s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
        }
        .sparkle:nth-child(1) { top: 10%; left: 25%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 78%; left: 82%; animation-delay: 0.5s; }
        .sparkle:nth-child(3) { top: 8%; left: 72%; animation-delay: 1s; }
        .sparkle:nth-child(4) { top: 88%; left: 18%; animation-delay: 1.5s; }
        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(2); }
        }

        .profile-name {
            font-size: 26px; font-weight: 900;
            letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            margin-top: 4px;
        }
        .profile-name::after {
            content: '';
            position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%);
            width: 40px; height: 2px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: nameLine 2s ease-in-out infinite;
        }
        @keyframes nameLine {
            0%, 100% { width: 40px; opacity: 0.6; }
            50% { width: 80px; opacity: 1; }
        }

        .profile-bio {
            font-size: 13px; color: #a1a1aa;
            letter-spacing: 0.5px;
            min-height: 18px;
            font-weight: 500;
            margin-top: 4px;
        }
        .profile-bio::after {
            content: '|';
            color: #fff;
            animation: blink 0.8s step-end infinite;
            margin-left: 2px;
            font-weight: 300;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .visitor-counter {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 7px 15px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-size: 11px; color: #a1a1aa;
            letter-spacing: 1px; font-weight: 600;
        }
        .visitor-counter .dot-live {
            width: 6px; height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        /* ==========================================
           VIDEO
           ========================================== */
        .video-wrapper {
            width: 100%; height: 200px;
            border-radius: 22px; overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,255,255,0.06);
            background: #0a0a0a;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            animation: fadeInUp 0.9s ease-out;
        }
        .video-wrapper:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255,255,255,0.15); }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; transition: all 0.5s ease; }
        .video-wrapper:hover video { transform: scale(1.05); }
        .video-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 55%;
            background: linear-gradient(to top, var(--bg), transparent);
            pointer-events: none;
        }

        /* ==========================================
           LINKS
           ========================================== */
        .links { width: 100%; display: flex; flex-direction: column; gap: 18px; }

        .link-item {
            animation: fadeInUp 0.6s ease-out backwards;
            display: flex; flex-direction: column; gap: 9px;
            position: relative;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 18px 24px;
            background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            color: #fff; text-decoration: none;
            font-weight: 700; font-size: 15px; letter-spacing: 1px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 24px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
            cursor: pointer; user-select: none;
        }

        .btn .btn-icon {
            position: relative; z-index: 3;
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px;
            transition: transform 0.4s ease;
            pointer-events: none;
            font-size: 20px;
        }
        .btn .btn-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 7px;
            display: block;
        }

        .btn .btn-text {
            position: relative; z-index: 3;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .btn:hover .btn-icon { transform: scale(1.25) rotate(-8deg); }

        .badge {
            position: absolute;
            top: -8px; right: 16px;
            padding: 3px 10px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            border-radius: 50px;
            z-index: 4;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            animation: badgePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes badgePop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .badge-new { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .badge-hot { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .badge-mod { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; }
        .badge-vip { background: linear-gradient(135deg, #facc15, #eab308); color: #000; }

        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease; z-index: 1;
        }
        .btn:hover::before { left: 150%; }

        .btn::after {
            content: ''; position: absolute; inset: 0;
            border-radius: 50px; padding: 2px;
            background: linear-gradient(45deg, transparent, #fff, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.4s ease; z-index: 2;
        }
        .btn:hover::after { opacity: 1; }

        .btn:hover {
            background: linear-gradient(145deg, #fff, #d4d4d8);
            color: #000;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255,255,255,0.15);
            border-color: transparent;
        }

        .btn.confirm {
            background: linear-gradient(145deg, #fff, #e5e5e5) !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 35px rgba(255,255,255,0.7), 0 15px 35px rgba(0,0,0,0.5) !important;
            animation: shakeConfirm 0.5s ease;
        }
        @keyframes shakeConfirm {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .ripple {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            animation: rippleAnim 0.8s ease-out;
            pointer-events: none; z-index: 2;
        }
        @keyframes rippleAnim { to { transform: scale(5); opacity: 0; } }

        .version-label {
            font-size: 11px; color: #52525b;
            letter-spacing: 1.5px; text-align: center;
            font-weight: 600; text-transform: uppercase;
            padding-left: 4px;
            transition: color 0.3s ease;
        }
        .link-item:hover .version-label { color: #a1a1aa; }

        /* ==========================================
           TOAST
           ========================================== */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255,255,255,0.98); color: #000;
            padding: 13px 26px; border-radius: 50px;
            font-size: 13px; font-weight: 700;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,255,255,0.3);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* ==========================================
           ANIMASI
           ========================================== */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .container { padding-top: 82px; gap: 20px; }
            .video-wrapper { height: 180px; }
            .btn { padding: 16px; font-size: 14px; }
            .top-nav { padding: 12px 15px; }
            .avatar-stage { width: 125px; height: 125px; }
            .profile-avatar { width: 94px; height: 94px; }
            .avatar-ring { width: 98px; height: 98px; }
            .profile-name { font-size: 22px; letter-spacing: 4px; }
            .clock-display { font-size: 11px; padding: 9px 12px; }
            .loader-stage { width: 140px; height: 140px; }
            .ring-outer { width: 140px; height: 140px; }
            .ring-mid { width: 115px; height: 115px; }
            .ring-inner { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- LOADING -->
    <div id="loader">
        <div class="loader-stage">
            <div class="loader-glow"></div>
            <div class="loader-ring ring-outer"></div>
            <div class="loader-ring ring-mid"></div>
            <div class="loader-ring ring-inner"></div>
            <div class="loader-logo" id="loaderLogo">⚡</div>
        </div>
        <div class="loader-bar-wrap">
            <div class="loader-bar"><div class="loader-bar-inner"></div></div>
            <div class="loader-text">Loading</div>
        </div>
    </div>

    <div class="grid-bg"></div>
    <canvas id="particles-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- TOP NAV -->
    <div class="top-nav">
        <div class="nav-content">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Cari link...">
            </div>
            <div class="clock-display" id="clockDisplay">--:--</div>
            <div class="menu-btn" id="menuBtn">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="profile" id="profileSection">
            <div class="avatar-stage" id="avatarStage">
                <div class="orbit-ring orbit-1"><span></span><span></span></div>
                <div class="orbit-ring orbit-2"><span></span><span></span></div>
                <div class="orbit-ring orbit-3"><span></span><span></span></div>
                <div class="pulse-wave"></div>
                <div class="pulse-wave"></div>
                <div class="pulse-wave"></div>
                <div class="avatar-ring"></div>
                <div class="profile-avatar" id="profileAvatar">
                    <span id="profileAvatarFallback">S</span>
                    <img id="profileAvatarImg" style="display:none;" alt="Logo">
                </div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
                <div class="sparkle"></div>
            </div>
            <div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-bio" id="profileBio"></div>
            </div>
            <div class="visitor-counter">
                <span class="dot-live"></span>
                <span id="visitorCount">0</span> views
            </div>
        </div>

        <div class="video-wrapper">
            <video id="mainVideo" autoplay loop muted playsinline></video>
            <div class="video-overlay"></div>
        </div>

        <div class="links" id="linksContainer"></div>
    </div>

    <div class="toast" id="toast"><span>👆</span> Klik sekali lagi untuk membuka</div>

    <script src="data.js"></script>
    <script>
        // ==========================================================
        //   1. PROXY HELPER - Bypass CORS untuk gambar eksternal
        // ==========================================================
        function proxify(url) {
            if (!url) return url;
            // Kalau link sudah dari proxy atau data URI, biarkan
            if (url.startsWith('data:') || url.startsWith('blob:')) return url;
            // Pakai weserv.nl proxy untuk bypass CORS
            return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, ''));
        }

        // ==========================================================
        //   2. TEMA
        // ==========================================================
        const theme = LINK_DATA.theme || {};
        if (theme.background) document.documentElement.style.setProperty('--bg', theme.background);
        if (theme.accent) document.documentElement.style.setProperty('--accent', theme.accent);
        document.body.style.background = theme.background || '#050505';

        // ==========================================================
        //   3. PROFILE
        // ==========================================================
        const profile = LINK_DATA.profile || {};
        if (profile.enabled) {
            document.getElementById('profileSection').classList.add('active');
            document.getElementById('profileName').textContent = profile.name || '';
            document.getElementById('profileBio').textContent = profile.bio || '';

            const avatarImg = document.getElementById('profileAvatarImg');
            const avatarFallback = document.getElementById('profileAvatarFallback');
            const loaderLogo = document.getElementById('loaderLogo');
            const avatarUrl = profile.avatar || '';
            const initial = (profile.name || 'S').charAt(0);

            function loadImage(url, onSuccess, onError) {
                if (!url) { onError(); return; }
                const img = new Image();
                img.onload = () => onSuccess(img.src);
                img.onerror = () => onError();
                img.src = proxify(url); // <-- Pakai proxy
            }

            // Load avatar in profile
            loadImage(avatarUrl,
                (src) => {
                    avatarImg.src = src;
                    avatarImg.style.display = 'block';
                    avatarFallback.style.display = 'none';
                },
                () => {
                    avatarImg.style.display = 'none';
                    avatarFallback.style.display = 'flex';
                    avatarFallback.textContent = initial;
                    avatarFallback.style.alignItems = 'center';
                    avatarFallback.style.justifyContent = 'center';
                    avatarFallback.style.width = '100%';
                    avatarFallback.style.height = '100%';
                    avatarFallback.style.fontSize = '42px';
                }
            );

            // Load avatar in loader
            loadImage(avatarUrl,
                (src) => {
                    loaderLogo.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = src;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover';
                    img.style.display = 'block';
                    loaderLogo.appendChild(img);
                },
                () => { loaderLogo.textContent = '⚡'; }
            );

            // Typing effect
            if (profile.typing && profile.bio) {
                const bioEl = document.getElementById('profileBio');
                const text = profile.bio;
                bioEl.textContent = '';
                let i = 0;
                setTimeout(() => {
                    const typeInterval = setInterval(() => {
                        bioEl.textContent = text.substring(0, i + 1);
                        i++;
                        if (i >= text.length) clearInterval(typeInterval);
                    }, 60);
                }, 2500);
            }

            // 3D tilt
            const stage = document.getElementById('avatarStage');
            const avatar = document.getElementById('profileAvatar');
            if (window.matchMedia('(hover: hover)').matches) {
                stage.addEventListener('mousemove', (e) => {
                    const rect = stage.getBoundingClientRect();
                    const x = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
                    const y = (e.clientY - rect.top - rect.height / 2) / (rect.height / 2);
                    avatar.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg) scale(1.06)`;
                });
                stage.addEventListener('mouseleave', () => { avatar.style.transform = ''; });
            }
        }

        // ==========================================================
        //   4. VISITOR COUNTER
        // ==========================================================
        (function() {
            let count = parseInt(localStorage.getItem('visitor_count') || '0') + 1;
            localStorage.setItem('visitor_count', count);
            const el = document.getElementById('visitorCount');
            let current = 0;
            const step = Math.max(1, Math.ceil(count / 30));
            const interval = setInterval(() => {
                current += step;
                if (current >= count) { current = count; clearInterval(interval); }
                el.textContent = current.toLocaleString();
            }, 30);
        })();

        // ==========================================================
        //   5. AUDIO
        // ==========================================================
        let audioCtx = null, soundEnabled = true;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch(e) { soundEnabled = false; }
            }
            return audioCtx;
        }
        function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0) {
            if (!soundEnabled) return;
            const ctx = ensureAudio(); if (!ctx) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = type;
            const t = ctx.currentTime + delay;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
        }
        function soundHover() { tone(1800, 0.05, 'sine', 0.04); }
        function soundClick() { tone(880, 0.1, 'sine', 0.15); tone(1320, 0.08, 'triangle', 0.08, 0.02); }
        function soundConfirm() {
            tone(880, 0.12, 'sine', 0.15);
            tone(1320, 0.15, 'sine', 0.12, 0.08);
            tone(1760, 0.25, 'sine', 0.1, 0.16);
        }
        function vibrate(ms = 40) { if (navigator.vibrate) navigator.vibrate(ms); }

        // ==========================================================
        //   6. VIDEO
        // ==========================================================
        const videoEl = document.getElementById('mainVideo');
        const sourceEl = document.createElement('source');
        sourceEl.src = LINK_DATA.videoUrl;
        sourceEl.type = 'video/mp4';
        videoEl.appendChild(sourceEl);
        videoEl.play().catch(() => {});

        // ==========================================================
        //   7. RENDER LINKS
        // ==========================================================
        const linksContainer = document.getElementById('linksContainer');
        const toast = document.getElementById('toast');

        function isImage(src) { return /\.(png|jpg|jpeg|gif|webp|svg)/i.test(src); }

        LINK_DATA.links.forEach((link, index) => {
            const item = document.createElement('div');
            item.className = 'link-item';
            item.style.animationDelay = (0.3 + (index * 0.08)) + 's';

            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'btn';
            a.dataset.name = link.name.toLowerCase();

            if (link.badge) {
                const badge = document.createElement('span');
                badge.className = 'badge badge-' + link.badge.toLowerCase();
                badge.textContent = link.badge;
                a.appendChild(badge);
            }

            const iconWrap = document.createElement('span');
            iconWrap.className = 'btn-icon';

            if (link.icon) {
                if (isImage(link.icon)) {
                    const img = document.createElement('img');
                    img.src = proxify(link.icon); // <-- Pakai proxy
                    img.alt = '';
                    img.onerror = () => { iconWrap.innerHTML = ''; iconWrap.textContent = '✦'; };
                    iconWrap.appendChild(img);
                } else {
                    iconWrap.textContent = link.icon;
                }
            } else {
                iconWrap.textContent = '✦';
            }

            const span = document.createElement('span');
            span.className = 'btn-text';
            span.textContent = link.name;

            a.appendChild(iconWrap);
            a.appendChild(span);

            a.addEventListener('mouseenter', soundHover);
            a.addEventListener('touchstart', soundHover, { passive: true });

            if (window.matchMedia('(hover: hover)').matches) {
                a.addEventListener('mousemove', (e) => {
                    const rect = a.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    a.style.transform = `translateY(-5px) scale(1.02) translate(${x * 0.06}px, ${y * 0.1}px)`;
                });
                a.addEventListener('mouseleave', () => { a.style.transform = ''; });
            }

            let confirmState = false;
            let resetTimer = null;
            let pressTimer = null;
            const originalText = link.name;

            // Long-press copy
            a.addEventListener('mousedown', () => {
                pressTimer = setTimeout(() => {
                    navigator.clipboard.writeText(link.url).then(() => {
                        showToast('📋 Link berhasil di-copy!');
                        vibrate(60);
                    }).catch(() => {});
                }, 700);
            });
            a.addEventListener('mouseup', () => clearTimeout(pressTimer));
            a.addEventListener('mouseleave', () => clearTimeout(pressTimer));
            a.addEventListener('touchstart', () => {
                pressTimer = setTimeout(() => {
                    navigator.clipboard.writeText(link.url).then(() => {
                        showToast('📋 Link berhasil di-copy!');
                        vibrate(60);
                    }).catch(() => {});
                }, 700);
            }, { passive: true });
            a.addEventListener('touchend', () => clearTimeout(pressTimer));

            a.addEventListener('click', function(e) {
                if (!confirmState) {
                    e.preventDefault();
                    confirmState = true;
                    soundClick();
                    vibrate(30);

                    const rect = a.getBoundingClientRect();
                    const x = (e.clientX || rect.left + rect.width/2) - rect.left;
                    const y = (e.clientY || rect.top + rect.height/2) - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (x - size/2) + 'px';
                    ripple.style.top = (y - size/2) + 'px';
                    a.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 800);

                    a.classList.add('confirm');
                    span.textContent = '⚠️ KLIK LAGI UNTUK BUKA';
                    showToast('👆 Klik sekali lagi untuk membuka');

                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => {
                        confirmState = false;
                        a.classList.remove('confirm');
                        span.textContent = originalText;
                    }, 3000);
                } else {
                    soundConfirm();
                    vibrate([30, 50, 30]);
                    confettiBurst();
                    hideToast();
                }
            });

            item.appendChild(a);

            if (link.version) {
                const versionEl = document.createElement('div');
                versionEl.className = 'version-label';
                versionEl.textContent = link.version;
                item.appendChild(versionEl);
            }

            linksContainer.appendChild(item);
        });

        // ==========================================================
        //   8. TOAST
        // ==========================================================
        let toastTimer = null;
        function showToast(msg) {
            toast.innerHTML = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 2500);
        }
        function hideToast() { toast.classList.remove('show'); }

        // ==========================================================
        //   9. CONFETTI
        // ==========================================================
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfetti();
        window.addEventListener('resize', resizeConfetti);

        function confettiBurst() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                confettiParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: ['#ffffff', '#a1a1aa', '#d4d4d8', '#71717a'][Math.floor(Math.random()*4)],
                    life: 1,
                    gravity: 0.15,
                    friction: 0.96,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15
                });
            }
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= p.friction; p.vy *= p.friction;
                p.vy += p.gravity;
                p.life -= 0.015;
                p.rotation += p.rotationSpeed;
                if (p.life <= 0) { confettiParticles.splice(i, 1); continue; }
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation * Math.PI / 180);
                confettiCtx.globalAlpha = p.life;
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                confettiCtx.restore();
            }
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        // ==========================================================
        //   10. SEARCH
        // ==========================================================
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.link-item').forEach(item => {
                const name = item.querySelector('.btn').dataset.name;
                item.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        });

        // ==========================================================
        //   11. MENU
        // ==========================================================
        document.getElementById('menuBtn').addEventListener('click', () => {
            soundClick();
            vibrate(30);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ==========================================================
        //   12. CLOCK
        // ==========================================================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clockDisplay').textContent = h + ':' + m;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ==========================================================
        //   13. SCROLL PROGRESS
        // ==========================================================
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const percent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            document.getElementById('scrollProgress').style.width = percent + '%';
        });

        // ==========================================================
        //   14. PARTIKEL
        // ==========================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        let shootingStars = [];
        const numberOfParticles = 90;
        const maxDistance = 130;
        const mouse = { x: null, y: null, radius: 120 };

        function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        setCanvasSize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.glow = Math.random() > 0.8;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = this.x - mouse.x, dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x += (dx / dist) * force * 3;
                        this.y += (dy / dist) * force * 3;
                    }
                }
            }
            draw() {
                if (this.glow) { ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(255,255,255,0.9)'; }
                else { ctx.shadowBlur = 0; }
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.len = Math.random() * 120 + 80;
                this.speed = Math.random() * 6 + 6;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
                this.opacity = 0.7;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.008;
                if (this.y > canvas.height + 50 || this.opacity <= 0) this.reset();
            }
            draw() {
                const tailX = this.x - Math.cos(this.angle) * this.len;
                const tailY = this.y - Math.sin(this.angle) * this.len;
                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = grad; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tailX, tailY); ctx.stroke();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle());
            shootingStars = [];
            for (let i = 0; i < 2; i++) shootingStars.push(new ShootingStar());
        }

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    const dx = particlesArray[a].x - particlesArray[b].x;
                    const dy = particlesArray[a].y - particlesArray[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const op = 1 - (dist / maxDistance);
                        ctx.strokeStyle = `rgba(255,255,255,${op * 0.18})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y); ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            shootingStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => { setCanvasSize(); init(); });

        init(); animate();

        // ==========================================================
        //   15. HIDE LOADER
        // ==========================================================
        setTimeout(() => {
            document.getElementById('loader').classList.add('hide');
        }, 2500);
    </script>
