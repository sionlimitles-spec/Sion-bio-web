<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIRIUKA | Bio Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --bg: #050505; --accent: #ffffff; }
        html, body { scroll-behavior: smooth; }
        body {
            background-color: var(--bg); color: #fff;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* FULLSCREEN VIDEO BACKGROUND */
        .bg-video-wrap { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
        .bg-video-wrap video { width: 100%; height: 100%; object-fit: cover; opacity: 0.35; filter: contrast(1.1) brightness(0.7); }
        .bg-video-overlay {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 0%, rgba(5,5,5,0.5) 0%, rgba(5,5,5,0.95) 70%),
                        linear-gradient(180deg, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0.9) 50%, rgba(5,5,5,1) 100%);
            pointer-events: none;
        }

        /* PIXEL LOADING */
        #loader {
            position: fixed; inset: 0; background: #000;
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 34px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loader.hide { opacity: 0; visibility: hidden; }
        .pixel-stage { display: flex; flex-direction: column; align-items: center; gap: 28px; }
        .pixel-logo {
            width: 84px; height: 84px;
            image-rendering: pixelated;
            position: relative;
            animation: pixelBounce 1s steps(2) infinite;
        }
        .pixel-logo img {
            width: 100%; height: 100%;
            object-fit: cover; image-rendering: pixelated;
            filter: contrast(1.2) saturate(0.9);
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .pixel-particles { position: relative; width: 130px; height: 50px; margin-top: -8px; }
        .pixel-particle {
            position: absolute; width: 5px; height: 5px;
            background: #fff; image-rendering: pixelated;
            animation: pixelFloat 2s steps(4) infinite;
        }
        .pixel-particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .pixel-particle:nth-child(2) { left: 30%; animation-delay: 0.3s; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .pixel-particle:nth-child(3) { left: 50%; animation-delay: 0.6s; }
        .pixel-particle:nth-child(4) { left: 70%; animation-delay: 0.9s; background: #a855f7; box-shadow: 0 0 8px #a855f7; }
        .pixel-particle:nth-child(5) { left: 88%; animation-delay: 1.2s; }
        @keyframes pixelFloat {
            0% { transform: translateY(50px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-25px); opacity: 0; }
        }
        .pixel-loading-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 18px; color: #fff;
            letter-spacing: 3px;
            text-shadow: 3px 3px 0 #000, 0 0 15px rgba(255,255,255,0.6);
            animation: pixelTextBlink 1s steps(2) infinite;
        }
        @keyframes pixelTextBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pixel-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .pixel-bar {
            display: flex; gap: 3px; padding: 5px;
            border: 4px solid #fff; background: #000;
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
        }
        .pixel-block {
            width: 14px; height: 20px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.2s steps(3);
        }
        .pixel-block.active {
            background: #fff;
            box-shadow: 0 0 12px #fff, inset 0 0 6px #aaa;
            border-color: #fff;
        }
        .pixel-block.active-2 {
            background: #22c55e;
            box-shadow: 0 0 12px #22c55e, inset 0 0 6px #16a34a;
            border-color: #22c55e;
        }
        .pixel-percent {
            font-family: 'Press Start 2P', monospace;
            font-size: 13px; color: #fff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .scroll-progress {
            position: fixed; top: 0; left: 0;
            height: 3px; width: 0%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            z-index: 9998;
            box-shadow: 0 0 12px #fff;
        }

        #particles-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9997; }

        /* TOP NAV */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: center;
            padding: 16px 18px; z-index: 10;
            background: linear-gradient(to bottom, rgba(5,5,5,0.95), transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-content { width: 100%; max-width: 500px; display: flex; gap: 12px; align-items: center; }
        .search-box {
            flex: 1; display: flex; align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px; padding: 13px 20px;
            transition: all 0.3s ease;
        }
        .search-box:focus-within { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.35); }
        .search-box svg { width: 20px; height: 20px; fill: #71717a; margin-right: 12px; flex-shrink: 0; }
        .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 15px; font-weight: 500; }
        .search-box input::placeholder { color: #52525b; }
        .clock-display {
            font-size: 14px; color: #d4d4d8; font-weight: 700;
            padding: 13px 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-variant-numeric: tabular-nums;
        }
        .menu-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; flex-shrink: 0;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn svg { width: 22px; height: 22px; fill: #fff; }

        /* CONTAINER */
        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 500px;
            padding: 100px 20px 60px;
            display: flex; flex-direction: column; gap: 28px;
            animation: fadeIn 1s ease-out;
        }

        /* PROFILE */
        .profile {
            display: none; flex-direction: column;
            align-items: center; text-align: center;
            gap: 20px;
            animation: fadeInUp 0.8s ease-out;
        }
        .profile.active { display: flex; }

        .avatar-wrapper {
            position: relative;
            width: 135px; height: 135px;
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-ring {
            position: absolute; inset: 0;
            border-radius: 50%; padding: 3px;
            background: conic-gradient(from 0deg, transparent 0%, #fff 30%, transparent 60%, #fff 90%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spinRing 3s linear infinite;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }
        .avatar-wrapper::before {
            content: '';
            position: absolute; inset: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: glowBreath 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowBreath {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.18); }
        }
        .profile-avatar {
            position: relative;
            width: 118px; height: 118px;
            border-radius: 50%; overflow: hidden;
            background: #0a0a0a;
            border: 3px solid rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center;
            font-size: 46px; font-weight: 900;
            z-index: 2;
            box-shadow: 0 0 28px rgba(255,255,255,0.3);
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ANIMATED NAME */
        .profile-name {
            font-size: 32px; font-weight: 900;
            letter-spacing: 6px; text-transform: uppercase;
            margin-top: 6px;
            background: linear-gradient(90deg, #fff 0%, #888 25%, #fff 50%, #888 75%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: nameShine 3s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.35));
        }
        @keyframes nameShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .profile-bio {
            font-size: 15px; color: #a1a1aa;
            letter-spacing: 1px;
            min-height: 20px;
            font-weight: 500;
            margin-top: 4px;
        }
        .profile-bio::after {
            content: '|'; color: #fff;
            animation: blink 0.9s step-end infinite;
            margin-left: 2px; font-weight: 300;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .visitor-counter {
            display: inline-flex; align-items: center; gap: 9px;
            padding: 9px 17px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-size: 12.5px; color: #a1a1aa;
            letter-spacing: 1px; font-weight: 600;
            margin-top: 6px;
        }
        .visitor-counter .dot-live {
            width: 8px; height: 8px;
            background: #22c55e; border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* LINKS */
        .links { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .link-item {
            animation: fadeInUp 0.6s ease-out backwards;
            display: flex; flex-direction: column; gap: 10px;
            position: relative;
        }

        /* MAIN BUTTON - BESAR */
        .btn {
            display: flex; align-items: center;
            width: 100%; padding: 16px 18px 16px 20px;
            background: linear-gradient(145deg, rgba(13,13,13,0.85), rgba(26,26,26,0.85));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 60px;
            color: #fff; text-decoration: none;
            font-weight: 700; font-size: 17px; letter-spacing: 1px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 15px 30px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer; user-select: none;
            gap: 14px;
            min-height: 78px;
        }

        /* ICON - BESAR */
        .btn .btn-icon {
            position: relative; z-index: 3;
            display: flex; align-items: center; justify-content: center;
            width: 52px; height: 52px;
            flex-shrink: 0;
            transition: transform 0.4s ease;
            pointer-events: none;
            font-size: 28px;
        }
        .btn .btn-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            border-radius: 10px;
        }

        .btn .btn-text {
            position: relative; z-index: 3;
            flex: 1;
            transition: all 0.3s ease;
            pointer-events: none;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 17px;
        }

        /* COPY BUTTON - BESAR */
        .copy-inline {
            width: 48px; height: 48px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; z-index: 5;
            padding: 0;
            outline: none;
        }
        .copy-inline svg { width: 22px; height: 22px; fill: #a1a1aa; transition: all 0.3s ease; pointer-events: none; }
        .copy-inline:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); transform: scale(1.08); }
        .copy-inline:hover svg { fill: #fff; }
        .copy-inline:active { transform: scale(0.9); }
        .copy-inline.copied {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34,197,94,0.7);
        }
        .copy-inline.copied svg { fill: #fff; animation: copyPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes copyPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); }
            100% { transform: scale(1); }
        }

        /* BADGE */
        .badge {
            position: absolute;
            top: -10px; right: 26px;
            padding: 5px 14px 5px 16px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            z-index: 5;
            text-transform: uppercase;
            clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%);
        }
        .badge-new { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; box-shadow: 0 4px 14px rgba(34,197,94,0.6), 0 0 0 2px rgba(255,255,255,0.2); }
        .badge-hot { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 4px 14px rgba(239,68,68,0.6), 0 0 0 2px rgba(255,255,255,0.2); }
        .badge-mod { background: linear-gradient(135deg, #a855f7, #7c3aed); color: #fff; box-shadow: 0 4px 14px rgba(168,85,247,0.6), 0 0 0 2px rgba(255,255,255,0.2); }
        .badge-vip { background: linear-gradient(135deg, #facc15, #eab308); color: #000; box-shadow: 0 4px 14px rgba(250,204,21,0.6), 0 0 0 2px rgba(255,255,255,0.2); }

        /* Shine */
        .btn .shine {
            position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
            z-index: 1;
            pointer-events: none;
            border-radius: 60px;
        }
        .btn:hover .shine { left: 150%; }

        .btn:hover {
            background: linear-gradient(145deg, #fff, #d4d4d8);
            color: #000;
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 25px 50px rgba(255,255,255,0.15);
            border-color: transparent;
        }
        .btn:hover .copy-inline { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.15); }
        .btn:hover .copy-inline svg { fill: #000; }

        .btn.confirm {
            background: linear-gradient(145deg, #fff, #e5e5e5) !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 40px rgba(255,255,255,0.7), 0 20px 45px rgba(0,0,0,0.5) !important;
            animation: shakeConfirm 0.5s ease;
        }
        .btn.confirm .copy-inline { background: rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.15); }
        .btn.confirm .copy-inline svg { fill: #000; }

        @keyframes shakeConfirm {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .ripple {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            animation: rippleAnim 0.8s ease-out;
            pointer-events: none; z-index: 2;
        }
        @keyframes rippleAnim { to { transform: scale(5); opacity: 0; } }

        .version-label {
            font-size: 12.5px; color: #52525b;
            letter-spacing: 2px; text-align: center;
            font-weight: 600; text-transform: uppercase;
            transition: color 0.3s ease;
        }
        .link-item:hover .version-label { color: #a1a1aa; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255,255,255,0.98); color: #000;
            padding: 15px 28px; border-radius: 50px;
            font-size: 14px; font-weight: 700;
            z-index: 999;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; white-space: nowrap;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .container { padding-top: 95px; gap: 24px; }
            .btn { padding: 14px 16px 14px 18px; font-size: 15px; min-height: 72px; gap: 12px; }
            .avatar-wrapper { width: 120px; height: 120px; }
            .profile-avatar { width: 104px; height: 104px; }
            .profile-name { font-size: 28px; letter-spacing: 5px; }
            .badge { font-size: 10px; padding: 4px 12px 4px 14px; right: 22px; }
            .clock-display { font-size: 12.5px; padding: 12px 15px; }
            .btn .btn-icon { width: 46px; height: 46px; font-size: 24px; }
            .btn .btn-text { font-size: 15px; }
            .copy-inline { width: 42px; height: 42px; }
            .copy-inline svg { width: 19px; height: 19px; }
            .pixel-logo { width: 72px; height: 72px; }
            .pixel-block { width: 11px; height: 16px; }
            .pixel-loading-text { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="bg-video-wrap"><video id="bgVideo" autoplay loop muted playsinline></video></div>
    <div class="bg-video-overlay"></div>

    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- PIXEL ART LOADING -->
    <div id="loader">
        <div class="pixel-stage">
            <div class="pixel-logo" id="loaderLogo">⚡</div>
            <div class="pixel-particles">
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
            </div>
        </div>
        <div class="pixel-loading-text">LOADING</div>
        <div class="pixel-bar-wrap">
            <div class="pixel-bar" id="pixelBar"></div>
            <div class="pixel-percent" id="pixelPercent">0%</div>
        </div>
    </div>

    <canvas id="particles-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- TOP NAV -->
    <div class="top-nav">
        <div class="nav-content">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Cari link...">
            </div>
            <div class="clock-display" id="clockDisplay">--:--</div>
            <div class="menu-btn" id="menuBtn">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="profile" id="profileSection">
            <div class="avatar-wrapper">
                <div class="avatar-ring"></div>
                <div class="profile-avatar" id="profileAvatar">
                    <span id="profileAvatarFallback">S</span>
                    <img id="profileAvatarImg" style="display:none;" alt="Logo">
                </div>
            </div>
            <div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-bio" id="profileBio"></div>
            </div>
            <div class="visitor-counter">
                <span class="dot-live"></span>
                <span id="visitorCount">0</span> views
            </div>
        </div>

        <div class="links" id="linksContainer"></div>
    </div>

    <div class="toast" id="toast">👆 Klik sekali lagi untuk membuka</div>

    <script src="data.js"></script>
    <script>
        // ==========================================================
        //   PROXY IMAGE LOADER
        // ==========================================================
        function buildProxyList(url) {
            if (!url) return [];
            if (url.startsWith('data:') || url.startsWith('blob:')) return [url];
            const clean = url.replace(/^https?:\/\//, '');
            const encoded = encodeURIComponent(url);
            return [
                url,
                'https://images.weserv.nl/?url=' + clean,
                'https://api.allorigins.win/raw?url=' + encoded,
                'https://corsproxy.io/?' + encoded,
                'https://api.codetabs.com/v1/proxy?quest=' + encoded
            ];
        }
        function loadImageWithFallback(url, onSuccess, onError) {
            const proxies = buildProxyList(url);
            let index = 0;
            function tryNext() {
                if (index >= proxies.length) { onError(); return; }
                const testUrl = proxies[index++];

                    clearTimeout(timer);

                    onSuccess(testUrl);

        // ==========================================================
        //   AUDIO ENGINE - UPGRADED
        // ==========================================================
        let audioCtx = null, soundEnabled = true;
        let masterGain = null;

        function ensureAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = 0.9;
                    masterGain.connect(audioCtx.destination);
                } catch(e) { soundEnabled = false; }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        // Oscillator + envelope
        function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0, detune = 0) {
            if (!soundEnabled) return;
            const ctx = ensureAudio(); if (!ctx) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(masterGain || ctx.destination);
            osc.type = type;
            if (detune) osc.detune.setValueAtTime(detune, ctx.currentTime);
            const t = ctx.currentTime + delay;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
        }

        // Noise burst (untuk tekstur)
        function noise(dur = 0.1, vol = 0.05, delay = 0, filterFreq = 2000) {
            if (!soundEnabled) return;
            const ctx = ensureAudio(); if (!ctx) return;
            const bufferSize = ctx.sampleRate * dur;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = filterFreq;
            const gain = ctx.createGain();
            source.connect(filter); filter.connect(gain); gain.connect(masterGain || ctx.destination);
            const t = ctx.currentTime + delay;
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            source.start(t); source.stop(t + dur);
        }

        // Sweep freq (naik / turun)
        function sweep(freqStart, freqEnd, dur, type = 'sine', vol = 0.12, delay = 0) {
            if (!soundEnabled) return;
            const ctx = ensureAudio(); if (!ctx) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(masterGain || ctx.destination);
            osc.type = type;
            const t = ctx.currentTime + delay;
            osc.frequency.setValueAtTime(freqStart, t);
            osc.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
        }

        function resizeConfetti() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
        resizeConfetti();

        function confettiBurst() {
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                confettiParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: ['#ffffff', '#a1a1aa', '#d4d4d8', '#71717a'][Math.floor(Math.random() * 4)],
                    life: 1, gravity: 0.15, friction: 0.96,
                    rotation: Math.random() * 360,

                });
            }
        }
        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= p.friction; p.vy *= p.friction;
                p.vy += p.gravity; p.life -= 0.015;
                p.rotation += p.rotationSpeed;
                if (p.life <= 0) { confettiParticles.splice(i, 1); continue; }
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation * Math.PI / 180);
                confettiCtx.globalAlpha = p.life;
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                confettiCtx.restore();
            }
            requestAnimationFrame(animateConfetti);
        }

        // ==========================================================

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [], shootingStars = [];
        const numberOfParticles = 80, maxDistance = 130;
        const mouse = { x: null, y: null, radius: 120 };
        function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        setCanvasSize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.glow = Math.random() > 0.8;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = this.x - mouse.x, dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x += (dx / dist) * force * 2.5;
                        this.y += (dy / dist) * force * 2.5;
                    }
                }
            }
            draw() {
                if (this.glow) { ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,255,255,0.9)'; }
                else { ctx.shadowBlur = 0; }
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = -20;
                this.len = Math.random() * 120 + 80;
                this.speed = Math.random() * 6 + 6;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
                this.opacity = 0.7;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.008;
                if (this.y > canvas.height + 50 || this.opacity <= 0) this.reset();
            }
            draw() {
                const tailX = this.x - Math.cos(this.angle) * this.len;
                const tailY = this.y - Math.sin(this.angle) * this.len;
                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = grad; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tailX, tailY); ctx.stroke();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle());
            shootingStars = [];
            for (let i = 0; i < 2; i++) shootingStars.push(new ShootingStar());
        }
        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    const dx = particlesArray[a].x - particlesArray[b].x;
                    const dy = particlesArray[a].y - particlesArray[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const op = 1 - (dist / maxDistance);
                        ctx.strokeStyle = `rgba(255,255,255,${op * 0.18})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            shootingStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => { setCanvasSize(); init(); });
        init(); animate();
    </script>

</body>
</html>
