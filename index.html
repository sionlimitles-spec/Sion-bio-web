<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHIRIUKA | Bio Link</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --bg: #050505; --accent: #ffffff; }
        html, body { scroll-behavior: smooth; }
        body {
            background-color: var(--bg); color: #fff;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* ==========================================
           FULLSCREEN VIDEO BACKGROUND (Fitur #6)
           ========================================== */
        .bg-video-wrap {
            position: fixed; inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-video-wrap video {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.35;
            filter: contrast(1.1) brightness(0.7);
        }
        .bg-video-overlay {
            position: fixed; inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 50% 0%, rgba(5,5,5,0.5) 0%, rgba(5,5,5,0.95) 70%),
                linear-gradient(180deg, rgba(5,5,5,0.6) 0%, rgba(5,5,5,0.9) 50%, rgba(5,5,5,1) 100%);
            pointer-events: none;
        }

        /* ==========================================
           PIXEL ART LOADING SCREEN
           ========================================== */
        #loader {
            position: fixed; inset: 0;
            background: #000;
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 30px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loader.hide { opacity: 0; visibility: hidden; }

        .pixel-stage {
            display: flex; flex-direction: column;
            align-items: center; gap: 24px;
        }

        /* Pixel logo block */
        .pixel-logo {
            width: 64px; height: 64px;
            image-rendering: pixelated;
            position: relative;
            animation: pixelBounce 1s steps(2) infinite;
        }
        .pixel-logo img {
            width: 100%; height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            filter: contrast(1.2) saturate(0.9);
            border: 2px solid #fff;
        }
        @keyframes pixelBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Floating pixel particles */
        .pixel-particles {
            position: relative;
            width: 100px; height: 40px;
            margin-top: -8px;
        }
        .pixel-particle {
            position: absolute;
            width: 4px; height: 4px;
            background: #fff;
            image-rendering: pixelated;
            animation: pixelFloat 2s steps(4) infinite;
        }
        .pixel-particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .pixel-particle:nth-child(2) { left: 30%; animation-delay: 0.3s; background: #22c55e; }
        .pixel-particle:nth-child(3) { left: 50%; animation-delay: 0.6s; }
        .pixel-particle:nth-child(4) { left: 70%; animation-delay: 0.9s; background: #a855f7; }
        .pixel-particle:nth-child(5) { left: 88%; animation-delay: 1.2s; }
        @keyframes pixelFloat {
            0% { transform: translateY(40px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
        }

        /* Loading text - pixel font */
        .pixel-loading-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #000, 0 0 10px rgba(255,255,255,0.5);
            animation: pixelTextBlink 1s steps(2) infinite;
        }
        @keyframes pixelTextBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Pixel bar */
        .pixel-bar-wrap {
            display: flex; flex-direction: column;
            align-items: center; gap: 12px;
        }
        .pixel-bar {
            display: flex;
            gap: 2px;
            padding: 4px;
            border: 3px solid #fff;
            background: #000;
            position: relative;
        }
        .pixel-block {
            width: 10px; height: 14px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.2s steps(3);
        }
        .pixel-block.active {
            background: #fff;
            box-shadow: 0 0 8px #fff, inset 0 0 4px #aaa;
            border-color: #fff;
        }
        .pixel-block.active-2 {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e, inset 0 0 4px #16a34a;
            border-color: #22c55e;
        }
        .pixel-percent {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
        }

        /* ==========================================
           SCROLL PROGRESS
           ========================================== */
        .scroll-progress {
            position: fixed; top: 0; left: 0;
            height: 2px; width: 0%;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            z-index: 9998;
            box-shadow: 0 0 10px #fff;
        }

        /* ==========================================
           CANVAS
           ========================================== */
        #particles-canvas {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none;
        }
        #confetti-canvas {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 9997;
        }

        /* ==========================================
           TOP NAV
           ========================================== */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: center;
            padding: 15px 18px; z-index: 10;
            background: linear-gradient(to bottom, rgba(5,5,5,0.95), transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-content { width: 100%; max-width: 460px; display: flex; gap: 10px; align-items: center; }
        .search-box {
            flex: 1; display: flex; align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px; padding: 10px 16px;
            transition: all 0.3s ease;
        }
        .search-box:focus-within {
            background: rgba(255,255,255,0.09);
            border-color: rgba(255,255,255,0.35);
        }
        .search-box svg { width: 16px; height: 16px; fill: #71717a; margin-right: 10px; flex-shrink: 0; }
        .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13.5px; font-weight: 500; }
        .search-box input::placeholder { color: #52525b; }
        .clock-display {
            font-size: 12px; color: #d4d4d8; font-weight: 700;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-variant-numeric: tabular-nums;
        }
        .menu-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease; flex-shrink: 0;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn svg { width: 18px; height: 18px; fill: #fff; }

        /* ==========================================
           CONTAINER
           ========================================== */
        .container {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px;
            padding: 82px 20px 50px;
            display: flex; flex-direction: column; gap: 22px;
            animation: fadeIn 1s ease-out;
        }

        /* ==========================================
           PROFILE
           ========================================== */
        .profile {
            display: none; flex-direction: column;
            align-items: center; text-align: center;
            gap: 16px;
            animation: fadeInUp 0.8s ease-out;
        }
        .profile.active { display: flex; }

        .avatar-wrapper {
            position: relative;
            width: 110px; height: 110px;
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-ring {
            position: absolute; inset: 0;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent 0%, #fff 30%, transparent 60%, #fff 90%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spinRing 3s linear infinite;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }
        .avatar-wrapper::before {
            content: '';
            position: absolute; inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: glowBreath 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowBreath {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.15); }
        }
        .profile-avatar {
            position: relative;
            width: 96px; height: 96px;
            border-radius: 50%;
            overflow: hidden;
            background: #0a0a0a;
            border: 2px solid rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 900;
            z-index: 2;
            box-shadow: 0 0 20px rgba(255,255,255,0.25);
        }
        .profile-avatar img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* ==========================================
           ANIMATED NAME (Fitur #5)
           ========================================== */
        .profile-name {
            font-size: 26px; font-weight: 900;
            letter-spacing: 5px; text-transform: uppercase;
            margin-top: 4px;
            background: linear-gradient(90deg, #fff 0%, #888 25%, #fff 50%, #888 75%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: nameShine 3s linear infinite;
            position: relative;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }
        @keyframes nameShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .profile-bio {
            font-size: 12.5px; color: #a1a1aa;
            letter-spacing: 0.8px;
            min-height: 16px;
            font-weight: 500;
            margin-top: 2px;
        }
        .profile-bio::after {
            content: '|';
            color: #fff;
            animation: blink 0.9s step-end infinite;
            margin-left: 2px;
            font-weight: 300;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .visitor-counter {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 6px 13px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            font-size: 10.5px; color: #a1a1aa;
            letter-spacing: 1px; font-weight: 600;
            margin-top: 4px;
        }
        .visitor-counter .dot-live {
            width: 6px; height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ==========================================
           VIDEO CARD (mini, karena bg sudah fullscreen)
           ========================================== */
        .video-card {
            display: none; /* Disembunyikan - video jadi fullscreen bg */
        }

        /* ==========================================
           LINKS
           ========================================== */
        .links { width: 100%; display: flex; flex-direction: column; gap: 16px; }

        .link-item {
            animation: fadeInUp 0.6s ease-out backwards;
            display: flex; flex-direction: column; gap: 8px;
            position: relative;
        }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 18px 24px;
            background: linear-gradient(145deg, rgba(13,13,13,0.85), rgba(26,26,26,0.85));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: #fff; text-decoration: none;
            font-weight: 700; font-size: 15px; letter-spacing: 1px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 24px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: visible;
            cursor: pointer; user-select: none;
        }

        .btn .btn-icon {
            position: relative; z-index: 3;
            display: flex; align-items: center; justify-content: center;
            width: 38px; height: 38px;
            transition: transform 0.4s ease;
            pointer-events: none;
            font-size: 20px;
            flex-shrink: 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 5px;
        }
        .btn .btn-icon img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 6px;
            display: block;
        }
        .btn .btn-text {
            position: relative; z-index: 3;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .btn:hover .btn-icon { transform: scale(1.15); }

        /* ==========================================
           BADGE - NEMPEL DI POJOK ATAS (FIXED)
           ========================================== */
        .badge {
            position: absolute;
            top: -8px;
            right: 24px;
            padding: 3px 10px 3px 8px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            z-index: 5;
            text-transform: uppercase;
            clip-path: polygon(6px 0, 100% 0, 100% 100%, 6px 100%, 0 50%);
            padding-left: 12px;
        }
        .badge-new {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 3px 10px rgba(34,197,94,0.5), 0 0 0 1.5px rgba(255,255,255,0.15);
        }
        .badge-hot {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 3px 10px rgba(239,68,68,0.5), 0 0 0 1.5px rgba(255,255,255,0.15);
        }
        .badge-mod {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: #fff;
            box-shadow: 0 3px 10px rgba(168,85,247,0.5), 0 0 0 1.5px rgba(255,255,255,0.15);
        }
        .badge-vip {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #000;
            box-shadow: 0 3px 10px rgba(250,204,21,0.5), 0 0 0 1.5px rgba(255,255,255,0.15);
        }

        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease; z-index: 1;
            border-radius: 50px;
            overflow: hidden;
        }
        .btn:hover::before { left: 150%; }

        .btn:hover {
            background: linear-gradient(145deg, #fff, #d4d4d8);
            color: #000;
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px rgba(255,255,255,0.15);
            border-color: transparent;
        }
        .btn:hover .btn-icon { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.1); }

        .btn.confirm {
            background: linear-gradient(145deg, #fff, #e5e5e5) !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 30px rgba(255,255,255,0.6), 0 15px 35px rgba(0,0,0,0.5) !important;
            animation: shakeConfirm 0.5s ease;
        }
        @keyframes shakeConfirm {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-4px); }
            40% { transform: translateX(4px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .ripple {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            animation: rippleAnim 0.8s ease-out;
            pointer-events: none; z-index: 2;
        }
        @keyframes rippleAnim { to { transform: scale(5); opacity: 0; } }

        /* ==========================================
           COPY BUTTON (Fitur #4)
           ========================================== */
        .link-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .link-row .btn { flex: 1; }

        .copy-btn {
            width: 52px; height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .copy-btn svg {
            width: 20px; height: 20px;
            fill: #fff;
            transition: transform 0.3s ease;
            z-index: 2;
        }
        .copy-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .copy-btn:hover svg { transform: scale(1.15); }
        .copy-btn:active { transform: scale(0.92); }
        .copy-btn.copied {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34,197,94,0.6);
        }
        .copy-btn.copied svg {
            animation: copyPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes copyPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        .version-label {
            font-size: 10.5px; color: #52525b;
            letter-spacing: 1.5px; text-align: center;
            font-weight: 600; text-transform: uppercase;
            transition: color 0.3s ease;
            padding-right: 62px; /* Space untuk copy button */
        }
        .link-item:hover .version-label { color: #a1a1aa; }

        /* ==========================================
           TOAST
           ========================================== */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255,255,255,0.98); color: #000;
            padding: 12px 24px; border-radius: 50px;
            font-size: 12.5px; font-weight: 700;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; white-space: nowrap;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 400px) {
            .container { padding-top: 78px; gap: 18px; }
            .btn { padding: 16px; font-size: 14px; }
            .avatar-wrapper { width: 100px; height: 100px; }
            .profile-avatar { width: 88px; height: 88px; }
            .profile-name { font-size: 22px; letter-spacing: 4px; }
            .badge { font-size: 8px; padding: 2px 8px 2px 10px; right: 18px; }
            .clock-display { font-size: 11px; padding: 8px 11px; }
            .copy-btn { width: 46px; height: 46px; }
            .copy-btn svg { width: 18px; height: 18px; }
            .btn .btn-icon { width: 34px; height: 34px; }
            .pixel-logo { width: 54px; height: 54px; }
            .pixel-block { width: 8px; height: 12px; }
        }
    </style>
</head>
<body>

    <!-- FULLSCREEN VIDEO BACKGROUND -->
    <div class="bg-video-wrap">
        <video id="bgVideo" autoplay loop muted playsinline></video>
    </div>
    <div class="bg-video-overlay"></div>

    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- PIXEL ART LOADING -->
    <div id="loader">
        <div class="pixel-stage">
            <div class="pixel-logo" id="loaderLogo">⚡</div>
            <div class="pixel-particles">
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
                <div class="pixel-particle"></div>
            </div>
        </div>
        <div class="pixel-loading-text" id="loadingText">LOADING</div>
        <div class="pixel-bar-wrap">
            <div class="pixel-bar" id="pixelBar"></div>
            <div class="pixel-percent" id="pixelPercent">0%</div>
        </div>
    </div>

    <canvas id="particles-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- TOP NAV -->
    <div class="top-nav">
        <div class="nav-content">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" placeholder="Cari link...">
            </div>
            <div class="clock-display" id="clockDisplay">--:--</div>
            <div class="menu-btn" id="menuBtn">
                <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="profile" id="profileSection">
            <div class="avatar-wrapper">
                <div class="avatar-ring"></div>
                <div class="profile-avatar" id="profileAvatar">
                    <span id="profileAvatarFallback">S</span>
                    <img id="profileAvatarImg" style="display:none;" alt="Logo">
                </div>
            </div>
            <div>
                <div class="profile-name" id="profileName"></div>
                <div class="profile-bio" id="profileBio"></div>
            </div>
            <div class="visitor-counter">
                <span class="dot-live"></span>
                <span id="visitorCount">0</span> views
            </div>
        </div>

        <div class="links" id="linksContainer"></div>
    </div>

    <div class="toast" id="toast">👆 Klik sekali lagi untuk membuka</div>

    <script src="data.js"></script>
    <script>
        // ==========================================================
        //   PROXY IMAGE LOADER
        // ==========================================================
        function buildProxyList(url) {
            if (!url) return [];
            if (url.startsWith('data:') || url.startsWith('blob:')) return [url];
            const clean = url.replace(/^https?:\/\//, '');
            const encoded = encodeURIComponent(url);
            return [
                url,
                'https://images.weserv.nl/?url=' + clean,
                'https://api.allorigins.win/raw?url=' + encoded,
                'https://corsproxy.io/?' + encoded,
                'https://api.codetabs.com/v1/proxy?quest=' + encoded
            ];
        }
        function loadImageWithFallback(url, onSuccess, onError) {
            const proxies = buildProxyList(url);
            let index = 0;
            function tryNext() {
                if (index >= proxies.length) { onError(); return; }
                const testUrl = proxies[index++];
                const img = new Image();
                let done = false;
                const timer = setTimeout(() => { if (!done) { done = true; tryNext(); } }, 5000);
                img.onload = () => {
                    if (done) return; done = true;
                    clearTimeout(timer);
                    if (img.naturalWidth < 5) { tryNext(); return; }
                    onSuccess(testUrl);
                };
                img.onerror = () => { if (done) return; done = true; clearTimeout(timer); tryNext(); };
                img.src = testUrl;
            }
            tryNext();
        }

        // ==========================================================
        //   TEMA
        // ==========================================================
        const theme = LINK_DATA.theme || {};
        if (theme.background) document.documentElement.style.setProperty('--bg', theme.background);
        if (theme.accent) document.documentElement.style.setProperty('--accent', theme.accent);
        document.body.style.background = theme.background || '#050505';

        // ==========================================================
        //   AUDIO ENGINE
        // ==========================================================
        let audioCtx = null, soundEnabled = true;
        function ensureAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch(e) { soundEnabled = false; }
            }
            return audioCtx;
        }
        function tone(freq, dur, type = 'sine', vol = 0.15, delay = 0) {
            if (!soundEnabled) return;
            const ctx = ensureAudio(); if (!ctx) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = type;
            const t = ctx.currentTime + delay;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.start(t); osc.stop(t + dur);
        }
        function soundHover() { tone(1800, 0.05, 'sine', 0.04); }
        function soundClick() { tone(880, 0.1, 'sine', 0.15); tone(1320, 0.08, 'triangle', 0.08, 0.02); }
        function soundConfirm() {
            tone(880, 0.12, 'sine', 0.15);
            tone(1320, 0.15, 'sine', 0.12, 0.08);
            tone(1760, 0.25, 'sine', 0.1, 0.16);
        }
        // Suara pixel loading (retro blip)
        function pixelBlip() {
            tone(1200, 0.04, 'square', 0.06);
        }
        function pixelComplete() {
            tone(523, 0.1, 'square', 0.1);
            tone(659, 0.1, 'square', 0.1, 0.1);
            tone(784, 0.1, 'square', 0.1, 0.2);
            tone(1046, 0.25, 'square', 0.12, 0.3);
        }
        function vibrate(ms = 40) { if (navigator.vibrate) navigator.vibrate(ms); }

        // ==========================================================
        //   PIXEL LOADING BAR (Fitur loading baru)
        // ==========================================================
        (function pixelLoader() {
            const bar = document.getElementById('pixelBar');
            const percentEl = document.getElementById('pixelPercent');
            const totalBlocks = 20;
            for (let i = 0; i < totalBlocks; i++) {
                const b = document.createElement('div');
                b.className = 'pixel-block';
                bar.appendChild(b);
            }
            const blocks = bar.querySelectorAll('.pixel-block');
            let current = 0;

            // Sound enabled setelah interaksi pertama
            const startSound = () => {
                document.removeEventListener('touchstart', startSound);
                document.removeEventListener('click', startSound);
                ensureAudio();
            };
            document.addEventListener('touchstart', startSound, { passive: true });
            document.addEventListener('click', startSound);

            // Animate block by block
            const interval = setInterval(() => {
                if (current >= totalBlocks) {
                    clearInterval(interval);
                    pixelComplete();
                    percentEl.textContent = '100%';
                    setTimeout(() => {
                        document.getElementById('loader').classList.add('hide');
                    }, 400);
                    return;
                }
                blocks[current].classList.add(current > 15 ? 'active-2' : 'active');
                current++;
                const percent = Math.round((current / totalBlocks) * 100);
                percentEl.textContent = percent + '%';
                if (current % 2 === 0) pixelBlip();
            }, 110);

            // Loader logo
            const loaderLogo = document.getElementById('loaderLogo');
            const profile = LINK_DATA.profile || {};
            if (profile.avatar) {
                loadImageWithFallback(profile.avatar,
                    (workingUrl) => {
                        loaderLogo.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = workingUrl;
                        img.style.cssText = 'width:100%;height:100%;object-fit:cover;image-rendering:pixelated;';
                        loaderLogo.appendChild(img);
                    },
                    () => { loaderLogo.textContent = '⚡'; }
                );
            }
        })();

        // ==========================================================
        //   FULLSCREEN BACKGROUND VIDEO
        // ==========================================================
        (function initBgVideo() {
            const v = document.getElementById('bgVideo');
            const source = document.createElement('source');
            source.src = LINK_DATA.videoUrl;
            source.type = 'video/mp4';
            v.appendChild(source);
            v.play().catch(() => {});
            // Slow playback
            v.playbackRate = 0.85;
        })();

        // ==========================================================
        //   PROFILE
        // ==========================================================
        const profile = LINK_DATA.profile || {};
        if (profile.enabled) {
            document.getElementById('profileSection').classList.add('active');
            document.getElementById('profileName').textContent = profile.name || '';
            const avatarUrl = profile.avatar || '';
            const initial = (profile.name || 'S').charAt(0);

            const avatarImg = document.getElementById('profileAvatarImg');
            const avatarFallback = document.getElementById('profileAvatarFallback');

            loadImageWithFallback(avatarUrl,
                (workingUrl) => {
                    avatarImg.src = workingUrl;
                    avatarImg.style.display = 'block';
                    avatarFallback.style.display = 'none';
                },
                () => {
                    avatarImg.style.display = 'none';
                    avatarFallback.style.display = 'flex';
                    avatarFallback.style.alignItems = 'center';
                    avatarFallback.style.justifyContent = 'center';
                    avatarFallback.style.width = '100%';
                    avatarFallback.style.height = '100%';
                    avatarFallback.textContent = initial;
                }
            );

            if (profile.typing && profile.bio) {
                const bioEl = document.getElementById('profileBio');
                const text = profile.bio;
                bioEl.textContent = '';
                let i = 0;
                setTimeout(() => {
                    const t = setInterval(() => {
                        bioEl.textContent = text.substring(0, i + 1);
                        i++;
                        if (i >= text.length) clearInterval(t);
                    }, 60);
                }, 2400);
            }
        }

        // ==========================================================
        //   VISITOR COUNTER
        // ==========================================================
        (function() {
            let count = parseInt(localStorage.getItem('visitor_count') || '0') + 1;
            localStorage.setItem('visitor_count', count);
            const el = document.getElementById('visitorCount');
            let cur = 0;
            const step = Math.max(1, Math.ceil(count / 30));
            const iv = setInterval(() => {
                cur += step;
                if (cur >= count) { cur = count; clearInterval(iv); }
                el.textContent = cur.toLocaleString();
            }, 30);
        })();

        // ==========================================================
        //   RENDER LINKS (+ Copy Button)
        // ==========================================================
        const linksContainer = document.getElementById('linksContainer');
        const toast = document.getElementById('toast');
        function isImage(src) { return /\.(png|jpg|jpeg|gif|webp|svg)/i.test(src); }

        LINK_DATA.links.forEach((link, index) => {
            const item = document.createElement('div');
            item.className = 'link-item';
            item.style.animationDelay = (0.3 + (index * 0.08)) + 's';

            // WRAPPER row (btn + copy)
            const row = document.createElement('div');
            row.className = 'link-row';

            // MAIN BUTTON
            const a = document.createElement('a');
            a.href = link.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.className = 'btn';
            a.dataset.name = link.name.toLowerCase();

            const iconWrap = document.createElement('span');
            iconWrap.className = 'btn-icon';
            if (link.icon) {
                if (isImage(link.icon)) {
                    loadImageWithFallback(link.icon,
                        (workingUrl) => {
                            const img = document.createElement('img');
                            img.src = workingUrl;
                            img.alt = '';
                            iconWrap.innerHTML = '';
                            iconWrap.appendChild(img);
                        },
                        () => { iconWrap.textContent = '✦'; }
                    );
                } else { iconWrap.textContent = link.icon; }
            } else { iconWrap.textContent = '✦'; }

            const span = document.createElement('span');
            span.className = 'btn-text';
            span.textContent = link.name;
            a.appendChild(iconWrap);
            a.appendChild(span);

            // BADGE
            if (link.badge) {
                const badge = document.createElement('span');
                badge.className = 'badge badge-' + link.badge.toLowerCase();
                badge.textContent = link.badge;
                a.appendChild(badge);
            }

            // COPY BUTTON
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.setAttribute('aria-label', 'Copy link');
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';

            copyBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const doCopy = () => {
                    navigator.clipboard.writeText(link.url).then(() => {
                        copyBtn.classList.add('copied');
                        copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
                        showToast('📋 Link berhasil di-copy!');
                        soundConfirm();
                        vibrate(50);
                        setTimeout(() => {
                            copyBtn.classList.remove('copied');
                            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
                        }, 2000);
                    }).catch(() => {
                        // Fallback
                        const ta = document.createElement('textarea');
                        ta.value = link.url; document.body.appendChild(ta);
                        ta.select(); document.execCommand('copy');
                        document.body.removeChild(ta);
                        showToast('📋 Link berhasil di-copy!');
                    });
                };
                doCopy();
            });

            // BUTTON CLICK (2x confirm)
            a.addEventListener('mouseenter', soundHover);
            a.addEventListener('touchstart', soundHover, { passive: true });

            let confirmState = false, resetTimer = null;
            const originalText = link.name;

            a.addEventListener('click', function(e) {
                if (!confirmState) {
                    e.preventDefault();
                    confirmState = true;
                    soundClick();
                    vibrate(30);

                    const rect = a.getBoundingClientRect();
                    const x = (e.clientX || rect.left + rect.width / 2) - rect.left;
                    const y = (e.clientY || rect.top + rect.height / 2) - rect.top;
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = ripple.style.height = size + 'px';
                    ripple.style.left = (x - size / 2) + 'px';
                    ripple.style.top = (y - size / 2) + 'px';
                    a.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 800);

                    a.classList.add('confirm');
                    span.textContent = '⚠️ KLIK LAGI';
                    showToast('👆 Klik sekali lagi untuk membuka');

                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => {
                        confirmState = false;
                        a.classList.remove('confirm');
                        span.textContent = originalText;
                    }, 3000);
                } else {
                    soundConfirm();
                    vibrate([30, 50, 30]);
                    confettiBurst();
                    hideToast();
                }
            });

            row.appendChild(a);
            row.appendChild(copyBtn);
            item.appendChild(row);

            if (link.version) {
                const versionEl = document.createElement('div');
                versionEl.className = 'version-label';
                versionEl.textContent = link.version;
                item.appendChild(versionEl);
            }

            linksContainer.appendChild(item);
        });

        // ==========================================================
        //   TOAST
        // ==========================================================
        let toastTimer = null;
        function showToast(msg) {
            toast.innerHTML = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 2500);
        }
        function hideToast() { toast.classList.remove('show'); }

        // ==========================================================
        //   CONFETTI
        // ==========================================================
        const confettiCanvas = document.getElementById('confetti-canvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        function resizeConfetti() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
        resizeConfetti();
        window.addEventListener('resize', resizeConfetti);

        function confettiBurst() {
            const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
            for (let i = 0; i < 60; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4;
                confettiParticles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    color: ['#ffffff', '#a1a1aa', '#d4d4d8', '#71717a'][Math.floor(Math.random() * 4)],
                    life: 1, gravity: 0.15, friction: 0.96,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 15
                });
            }
        }
        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= p.friction; p.vy *= p.friction;
                p.vy += p.gravity; p.life -= 0.015;
                p.rotation += p.rotationSpeed;
                if (p.life <= 0) { confettiParticles.splice(i, 1); continue; }
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation * Math.PI / 180);
                confettiCtx.globalAlpha = p.life;
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                confettiCtx.restore();
            }
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        // ==========================================================
        //   SEARCH
        // ==========================================================
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.link-item').forEach(item => {
                const name = item.querySelector('.btn').dataset.name;
                item.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        });

        // ==========================================================
        //   MENU
        // ==========================================================
        document.getElementById('menuBtn').addEventListener('click', () => {
            soundClick(); vibrate(30);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ==========================================================
        //   CLOCK
        // ==========================================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clockDisplay').textContent =
                String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ==========================================================
        //   SCROLL PROGRESS
        // ==========================================================
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            document.getElementById('scrollProgress').style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
        });

        // ==========================================================
        //   PARTIKEL
        // ==========================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [], shootingStars = [];
        const numberOfParticles = 80, maxDistance = 130;
        const mouse = { x: null, y: null, radius: 120 };
        function setCanvasSize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        setCanvasSize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.glow = Math.random() > 0.8;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = this.x - mouse.x, dy = this.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x += (dx / dist) * force * 2.5;
                        this.y += (dy / dist) * force * 2.5;
                    }
                }
            }
            draw() {
                if (this.glow) { ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(255,255,255,0.9)'; }
                else { ctx.shadowBlur = 0; }
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = -20;
                this.len = Math.random() * 120 + 80;
                this.speed = Math.random() * 6 + 6;
                this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
                this.opacity = 0.7;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.008;
                if (this.y > canvas.height + 50 || this.opacity <= 0) this.reset();
            }
            draw() {
                const tailX = this.x - Math.cos(this.angle) * this.len;
                const tailY = this.y - Math.sin(this.angle) * this.len;
                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = grad; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(tailX, tailY); ctx.stroke();
            }
        }

        function init() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) particlesArray.push(new Particle());
            shootingStars = [];
            for (let i = 0; i < 2; i++) shootingStars.push(new ShootingStar());
        }
        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    const dx = particlesArray[a].x - particlesArray[b].x;
                    const dy = particlesArray[a].y - particlesArray[b].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < maxDistance) {
                        const op = 1 - (dist / maxDistance);
                        ctx.strokeStyle = `rgba(255,255,255,${op * 0.18})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            shootingStars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animate);
        }
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('resize', () => { setCanvasSize(); init(); });
        init(); animate();
    </script>

</body>
</html>
